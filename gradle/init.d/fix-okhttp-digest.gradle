allprojects { proj ->
    proj.buildscript {
        repositories {
            mavenCentral()
        }
        configurations.all {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'com.burgstaller' && details.requested.name == 'okhttp-digest') {
                    details.useTarget 'io.github.rburgst:okhttp-digest:2.5'
                    details.because 'com.burgstaller:okhttp-digest:1.10 removed upstream'
                }
            }
        }
    }
}
